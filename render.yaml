services:
  - type: web
    name: home-team-pj
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: SCHOOL_AI_API_KEY
        sync: false
      - key: SCHOOL_AI_API_URL
        value: https://api.stg.ai.kudan.ed.jp/v1/external/chat
